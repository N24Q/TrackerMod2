modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Client-side tool statistics. Adds a tooltip to tools, weapons and gear showing how much you have used them:
blocks mined, blocks tilled, sheep sheared, mobs killed, items caught, attacks blocked, fires lit, blocks brushed and elytra flight time.
Works in singleplayer and on servers without needing the mod on the server.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
